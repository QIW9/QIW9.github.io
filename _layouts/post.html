---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {% if page.categories or page.tags %}
    <p class="post-meta">
      {% for category in page.categories %}
      <a class="tag" href="{{ site.baseurl }}/tags.html#cat-{{ category }}">#{{ category }}</a>
      {% endfor %}
      {% for tag in page.tags %}
      <a class="tag" href="{{ site.baseurl }}/tags.html#{{ tag }}">#{{ tag }}</a>
      {% endfor %}
    </p>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
